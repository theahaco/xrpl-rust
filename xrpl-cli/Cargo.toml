[package]
name = "xrpl-cli"
version = "0.1.0"
edition = "2021"
description = "Command line interface for the XRP Ledger, built on xrpl-rust"
readme = "README.md"
license = "ISC"
repository = "https://github.com/theahaco/xrpl-rust"
keywords = ["xrpl", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "xrpl"
path = "src/main.rs"

[dependencies]
# `default-features = false` followed by a verbatim copy of the default list was
# a no-op that made a lighter CLI build inexpressible. The CLI needs exactly the
# defaults today; name any narrowing here when a feature actually gets dropped.
xrpl-rust = { version = "1.2.0", path = ".." }

bip39 = { version = "2.1.0", features = ["rand_core", "zeroize"] }
clap = { version = "4.5.39", features = ["derive", "env"] }
# Passphrase encryption for key material: scrypt + ChaCha20-Poly1305 in a
# reviewed, specified format, rather than a hand-rolled one.
age = { version = "0.11", default-features = false, features = ["armor"] }
hex = "0.4.3"
rand = "0.8.5"
# Reads a secret from the controlling terminal with echo off, and restores the
# terminal state on the way out. The alternative is a hand-rolled `termios`
# whose layout differs between macOS and Linux.
rpassword = "7"
serde = { version = "1.0", features = ["derive"] }
secrecy = "0.10"
serde_json = "1.0"
# `tx edit` writes the transaction to a 0600 file for the editor and removes it
# afterwards, including on error.
tempfile = "3"
toml = "0.8"
thiserror-no-std = "2.0.2"
tokio = { version = "1.0", features = ["rt-multi-thread"] }
url = "2.2.2"
zeroize = { version = "1.5.7", features = ["alloc"] }

[dev-dependencies]
tempfile = "3"

[features]
default = []
# Integration tests drive the built binary against a standalone node.
integration = []
