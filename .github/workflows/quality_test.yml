on:
  push:
    branches:
      - main
  # No branch filter: a stacked pull request targets the branch below it, not
  # `main`, so a filtered trigger means every PR in a stack runs no checks at
  # all until the bottom of the stack merges. Breakage then surfaces all at
  # once, in the one PR that finally targets `main`.
  pull_request:
  schedule:
    - cron: "0 0 * * *"

name: Quality Check

jobs:
  quality_check:
    name: Quality Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies
        # RUSTSEC-2026-0235: rkyv 0.7 is an optional dep of rust_decimal that
        # we do not enable (features = ["serde"] only); ignored until
        # rust_decimal ships rkyv 0.8+ support.
        run: cargo audit --ignore RUSTSEC-2026-0235
