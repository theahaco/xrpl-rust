on:
  push:
    branches:
      - main
  # No branch filter: a stacked pull request targets the branch below it, not
  # `main`, so a filtered trigger means every PR in a stack runs no checks at
  # all until the bottom of the stack merges. Breakage then surfaces all at
  # once, in the one PR that finally targets `main`.
  pull_request:

name: Build & Lint

jobs:
  build_and_lint:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-build-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-lint-

      - name: Check formatting
        run: cargo fmt --all -- --check

      # A generated command surface is invisible to review otherwise: nothing in
      # a pull request shows that a field changed type or stopped being required.
      - name: Check the tx surface snapshot is current
        run: |
          cargo run -q -p xrpl-cli --bin tx-surface > /tmp/tx-surface.md
          diff -u xrpl-cli/TX_SURFACE.md /tmp/tx-surface.md || {
            echo "::error::xrpl-cli/TX_SURFACE.md is stale. Regenerate it with:"
            echo "::error::  cargo run -p xrpl-cli --bin tx-surface > xrpl-cli/TX_SURFACE.md"
            exit 1
          }

      - name: Clippy
        run: cargo clippy --workspace --all-features -- -D warnings

      - name: Build (default)
        run: cargo build --release

      - name: Build (no-default)
        run: cargo build --release --no-default-features

      - name: Build (no_std)
        run: cargo build --release --no-default-features --features embassy-rt,core,wallet,models,helpers,websocket,json-rpc

      - name: Build (core-only)
        run: cargo build --release --no-default-features --features core

      - name: Build (wallet-only)
        run: cargo build --release --no-default-features --features wallet

      - name: Build (models-only)
        run: cargo build --release --no-default-features --features models

      - name: Build (helpers-only)
        run: cargo build --release --no-default-features --features websocket,json-rpc,helpers,tokio-rt

      - name: Build (websocket-only)
        run: cargo build --release --no-default-features --features websocket

      - name: Build (json-rpc-only)
        run: cargo build --release --no-default-features --features json-rpc
